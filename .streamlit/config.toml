[server]
# Yükleme sınırı (MB): CICIDS2017 günlük dosyaları 100-300 MB olabiliyor
maxUploadSize = 500

[browser]
gatherUsageStats = false

# Ana renk mavi: kırmızı yalnızca kritik alarm kartlarında kullanılsın.
# [theme] altına doğrudan primaryColor yazmak uygulamayı açık temaya sabitler; açık ve koyu
# tema için ayrı bölümler kullanılınca uygulama sistemin temasını izlemeye devam eder.
[theme.light]
primaryColor = "#3B6FD4"

[theme.dark]
primaryColor = "#5B8DEF"
